<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Artisanat</title>
    <!-- Liaison avec le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
      <h1>Atelier Artisanat</h1>
      <p>Bienvenue sur notre site de présentation.</p>
      
      <p>📞 Téléphone : <a href="tel:+22899658573">+228 99 65 85 73</a></p>
      
      <div style="margin: 20px 0;">
        <a href="https://wa.me/22899658573?text=Bonjour,%20je%20souhaite%20un%20renseignement" class="btn-whatsapp">
           💬 Discuter sur WhatsApp
        </a>
      </div>

      <hr>

      <!-- 🧮 MODULE JAVASCRIPT : Calculateur de devis -->
      <div class="card card-highlight">
        <h2>Estimez votre Devis en Direct</h2>
        
        <p>
          <label>Choisissez un article :
            <select id="article">
              <option value="15000">Chaise en bois massif (15 000 FCFA)</option>
              <option value="50000">Table à manger (50 000 FCFA)</option>
              <option value="35000">Armoire de rangement (35 000 FCFA)</option>
            </select>
          </label>
        </p>

        <p>
          <label>Quantité :
            <input type="number" id="quantite" value="1" min="1">
          </label>
        </p>

        <h3>Total estimé : <span id="prix-total" class="prix-affichage">15 000</span> FCFA</h3>
      </div>

      <hr>

      <!-- Formulaire de Contact Netlify -->
      <div class="card">
        <h2>Envoyez-nous un message</h2>
        
        <form name="contact" method="POST" data-netlify="true">
          <input type="hidden" name="form-name" value="contact" />

          <p>
            <label>Votre Nom :
              <input type="text" name="name" required>
            </label>
          </p>
          <p>
            <label>Votre Téléphone ou Email :
              <input type="text" name="contact_info" required>
            </label>
          </p>
          <p>
            <label>Votre Message :
              <textarea name="message" rows="4" required></textarea>
            </label>
          </p>
          <p>
            <button type="submit" class="btn-primary">
              ✉️ Envoyer le message
            </button>
          </p>
        </form>
      </div>
    </div>

    <!-- Liaison avec le fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
